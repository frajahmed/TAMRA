[project]
name = "tamra-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM", "D101", "D102", "D103"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
# Every public class, method and function needs a docstring (what and why), except tests,
# settings and the Django entry point.
"*/tests/*" = ["D101", "D102", "D103"]
"config/*" = ["D101", "D102", "D103"]
"manage.py" = ["D103"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "accounts"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "config/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
