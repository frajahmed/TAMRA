openapi: 3.0.3
info:
  title: TAMRA API
  version: 1.0.0
  description: API for the TAMRA nutrition tracker app.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Email + password → JWT. Limited per IP address against password
        guessing.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create an account and return JWT tokens (the user is logged in
        directly).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/diary/:
    get:
      operationId: diary_list
      description: Entries of ?date=, sorted by meal.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local day (YYYY-MM-DD)
        required: true
      tags:
      - diary
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiaryEntry'
          description: ''
    post:
      operationId: diary_create
      description: 'GET: entries of one day. POST: add an entry.'
      tags:
      - diary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryEntryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiaryEntryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiaryEntryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryEntry'
          description: ''
  /api/v1/diary/{id}/:
    get:
      operationId: diary_retrieve
      description: Read, change or delete one diary entry.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - diary
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryEntry'
          description: ''
    patch:
      operationId: diary_partial_update
      description: Read, change or delete one diary entry.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - diary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDiaryEntryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDiaryEntryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDiaryEntryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryEntry'
          description: ''
    delete:
      operationId: diary_destroy
      description: Read, change or delete one diary entry.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - diary
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/diary/copy/:
    post:
      operationId: diary_copy_create
      description: Copy all entries of a day (or one meal) to another day.
      tags:
      - diary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryCopyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiaryCopyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiaryCopyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryCopyResult'
          description: ''
  /api/v1/diary/summary/:
    get:
      operationId: diary_summary_retrieve
      description: Totals of ?date= overall and per meal (meals without entries are
        0), targets and unit.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local day (YYYY-MM-DD)
        required: true
      tags:
      - diary
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiarySummary'
          description: ''
  /api/v1/foods/:
    get:
      operationId: foods_list
      description: Search foods by name or brand (?q=, optional ?country=).
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: ISO code; these foods come first
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: min. 2 letters
        required: true
      tags:
      - foods
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFoodList'
          description: ''
    post:
      operationId: foods_create
      description: 'GET: search foods by name or brand. POST: create a custom food.'
      tags:
      - foods
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFoodRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomFoodRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomFoodRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFood'
          description: ''
  /api/v1/foods/{id}/:
    get:
      operationId: foods_retrieve
      description: One food by id (shared foods and the user's own foods).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - foods
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
          description: ''
  /api/v1/foods/barcode/{barcode}/:
    get:
      operationId: foods_barcode_retrieve
      description: 'Find a food by barcode: own food, local database, then Open Food
        Facts.'
      parameters:
      - in: path
        name: barcode
        schema:
          type: string
        required: true
      tags:
      - foods
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Report that the API is running (used by Docker and monitoring).
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me/:
    delete:
      operationId: me_destroy
      description: Delete the account and all personal data for real after checking
        the password (Art. 17).
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/consents/:
    get:
      operationId: me_consents_list
      description: 'GET: the user''s consents. POST: give a consent.'
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consent'
          description: ''
    post:
      operationId: me_consents_create
      description: 'GET: the user''s consents. POST: give a consent.'
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
          description: ''
  /api/v1/me/consents/{consent_type}/withdraw/:
    post:
      operationId: me_consents_withdraw_create
      description: Mark the active consent of this type as withdrawn.
      parameters:
      - in: path
        name: consent_type
        schema:
          type: string
        required: true
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawResult'
          description: ''
  /api/v1/me/export/:
    get:
      operationId: me_export_retrieve
      description: Download all personal data as a JSON file (GDPR Art. 15 and 20).
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/me/profile/:
    get:
      operationId: me_profile_retrieve
      description: The logged-in user's profile. Created on first access.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: me_profile_partial_update
      description: The logged-in user's profile. Created on first access.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/me/trial/:
    get:
      operationId: me_trial_retrieve
      description: Tell the app whether the logged-in user may start a free trial.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialResult'
          description: ''
    post:
      operationId: me_trial_create
      description: Start the free trial once per email and device (409 when already
        used).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrialRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrialRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrialRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialResult'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialResult'
          description: ''
  /api/v1/stats/summary/:
    get:
      operationId: stats_summary_retrieve
      description: Statistics from ?from= to ?to= (every day listed, empty days as
        zeros).
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: to
        schema:
          type: string
          format: date
        required: true
      tags:
      - stats
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummary'
          description: ''
  /api/v1/water/:
    get:
      operationId: water_list
      description: Water entries of ?date=.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local day (YYYY-MM-DD)
        required: true
      tags:
      - water
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WaterLog'
          description: ''
    post:
      operationId: water_create
      description: 'GET: water entries of ?date= (required). POST: add a glass or
        bottle.'
      tags:
      - water
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaterLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WaterLogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WaterLogRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaterLog'
          description: ''
  /api/v1/water/{id}/:
    delete:
      operationId: water_destroy
      description: Delete one water entry.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - water
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/water/summary/:
    get:
      operationId: water_summary_retrieve
      description: Sum of all water entries of ?date=.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The user's local day (YYYY-MM-DD)
        required: true
      tags:
      - water
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaterSummary'
          description: ''
  /api/v1/weight/:
    get:
      operationId: weight_list
      description: The user's weights, optionally from/to a date.
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: to
        schema:
          type: string
          format: date
      tags:
      - weight
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeightLog'
          description: ''
    post:
      operationId: weight_create
      description: 'GET: weights (newest first), optional ?from=&to=. POST: one weight
        per day (update → 200).'
      tags:
      - weight
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeightLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WeightLogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WeightLogRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightLog'
          description: ''
  /api/v1/weight/{id}/:
    get:
      operationId: weight_retrieve
      description: Read, change or delete one weight entry.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - weight
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightLog'
          description: ''
    put:
      operationId: weight_update
      description: Read, change or delete one weight entry.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - weight
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeightLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WeightLogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WeightLogRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightLog'
          description: ''
    patch:
      operationId: weight_partial_update
      description: Read, change or delete one weight entry.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - weight
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWeightLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWeightLogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWeightLogRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightLog'
          description: ''
    delete:
      operationId: weight_destroy
      description: Read, change or delete one weight entry.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - weight
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    ActivityLevelEnum:
      enum:
      - sedentary
      - light
      - moderate
      - active
      - very_active
      type: string
      description: |-
        * `sedentary` - Sedentary
        * `light` - Light
        * `moderate` - Moderate
        * `active` - Active
        * `very_active` - Very Active
    BlankEnum:
      enum:
      - ''
    Consent:
      type: object
      description: A consent with version and timestamps; the user is set by the server.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        version:
          type: string
          maxLength: 20
        given_at:
          type: string
          format: date-time
          readOnly: true
        withdrawn_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - given_at
      - id
      - type
      - version
      - withdrawn_at
    ConsentRequest:
      type: object
      description: A consent with version and timestamps; the user is set by the server.
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        version:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - type
      - version
    CustomFood:
      type: object
      description: A food the user creates when it is missing (e.g. after a barcode
        scan).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        brand:
          type: string
          maxLength: 255
        barcode:
          type: string
          nullable: true
          maxLength: 32
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
          default: user
        is_custom:
          type: boolean
          description: True when the logged-in user created this food.
          readOnly: true
        countries:
          type: string
          readOnly: true
          description: Comma-separated ISO codes, e.g. de,fr
        kcal:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        protein:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        carbs:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        sugar:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        fat:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        saturated_fat:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        fiber:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        salt:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        alcohol:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        serving_size_g:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          nullable: true
        serving_label:
          type: string
          maxLength: 100
        image_url:
          type: string
          format: uri
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - countries
      - id
      - image_url
      - is_custom
      - kcal
      - name
      - source
      - updated_at
