name: App

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml", ".github/scripts/**"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml", ".github/scripts/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install
        run: flutter pub get
      - name: Format (fixed automatically by the Autofix workflow)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.txt
      - name: Report analyze result
        if: steps.analyze.outcome == 'failure'
        run: bash ../.github/scripts/annotate.sh analyze.txt "flutter analyze"
      - name: Tests with coverage
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --coverage --reporter expanded 2>&1 | tee test.txt
      - name: Report test result
        if: steps.tests.outcome == 'failure'
        run: bash ../.github/scripts/annotate.sh test.txt "flutter test"
      - name: Fail if analyze or tests failed
        if: steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          echo "analyze=${{ steps.analyze.outcome }} tests=${{ steps.tests.outcome }}"
          exit 1
