name: Autofix

# Formats code after a merge to main and pushes the result to main.
# It no longer pushes into pull-request branches: Codex works in a local clone, and a bot commit
# on the branch made the next upload fail (non-fast-forward) and caused merge conflicts.
# Only formatters run here (no `dart fix`, no `ruff --fix`), so the pushed commit never changes
# behaviour. `git add -u` stages only tracked files (no new pubspec.lock or build output).
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so this cannot loop.

on:
  push:
    branches: [main]
    paths: ["api/**", "app/**"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python format
        run: |
          pip install ruff
          cd api
          ruff format .
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dart format
        run: |
          cd app
          flutter pub get
          dart format lib test
          # Formatting can split one-line `if` statements, which `flutter analyze` then
          # rejects (curly_braces_in_flow_control_structures). Never push a broken main:
          # if analyze fails after formatting, drop the app formatting for this run.
          if ! flutter analyze; then
            echo "::warning::Dart formatting would break flutter analyze - app formatting skipped"
            git checkout -- lib test
          fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u api app
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "style: autoformat"
            git push
          fi
