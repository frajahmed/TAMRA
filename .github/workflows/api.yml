name: API

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tamra
          POSTGRES_USER: tamra
          POSTGRES_PASSWORD: tamra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tamra"
          --health-interval 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: tamra
      POSTGRES_USER: tamra
      POSTGRES_PASSWORD: tamra
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format (fixed automatically by the Autofix workflow)
        continue-on-error: true
        run: ruff format --check .
      - name: Django checks
        run: python manage.py check
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: |
          coverage run manage.py test
          coverage report
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
      - name: OpenAPI contract up to date (docs/openapi.yaml)
        continue-on-error: true
        run: diff -u ../docs/openapi.yaml /tmp/openapi.yaml
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
